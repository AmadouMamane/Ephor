# ÉTAGE 2 — file de fusion. Budget : une dizaine de minutes, impitoyablement sélectionnée.
# Question à se poser avant d'ajouter un test ici : « peut-il échouer à cause de
# l'INTERACTION entre deux changements ? » Sinon, il appartient à l'étage 1 ou 3.
name: merge-queue
on:
  merge_group:
permissions:
  contents: read
concurrency:
  group: merge-queue
  cancel-in-progress: false
jobs:
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VERIFY_STRICT: "1"
      PYTEST_MARK: "not slow and not flaky"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - run: uv sync --all-extras
      - name: suite hors tests lents et instables, sur le résultat combiné
        run: bash .ephor/projet/verify.sh
